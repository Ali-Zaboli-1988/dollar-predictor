name: Real Data Calibration

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'data/**'
      - 'tools/**'
      - '.github/workflows/real-calibration.yml'

jobs:
  calibrate-real-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run data validation tests
        working-directory: tools
        run: python test_training_data.py

      - name: Run TGJU fetcher tests
        working-directory: tools
        run: python test_fetch_tgju_history.py

      - name: Run news feature tests
        working-directory: tools
        run: python test_news_features.py

      - name: Fetch recent historical USD/IRR closes from TGJU
        run: |
          python tools/fetch_tgju_history.py \
            data/tgju_usd_free_market_live.csv \
            --length 75

      - name: Build historical news features from GDELT
        run: |
          python tools/build_news_features.py \
            data/tgju_usd_free_market_live.csv \
            data/tgju_usd_free_market_enriched.csv \
            --sleep 0.5

      - name: Validate enriched training data
        working-directory: tools
        run: python validate_training_data.py ../data/tgju_usd_free_market_enriched.csv --minimum-rows 60

      - name: Run strict walk-forward calibration
        run: |
          python tools/calibrate_weights.py \
            data/tgju_usd_free_market_enriched.csv \
            --train-size 40 \
            --test-size 7 \
            --threshold 1.0 \
            --min-move 0.003 \
            --min-weight 0 \
            --max-weight 2

      - name: Upload enriched dataset
        uses: actions/upload-artifact@v4
        with:
          name: real-training-data
          path: data/tgju_usd_free_market_enriched.csv

      - name: Upload fetched price history
        uses: actions/upload-artifact@v4
        with:
          name: real-tgju-price-history
          path: data/tgju_usd_free_market_live.csv
