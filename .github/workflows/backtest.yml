name: Validate Backtest Tools

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/**'
      - '.github/workflows/backtest.yml'
  pull_request:
    paths:
      - 'tools/**'
      - '.github/workflows/backtest.yml'
  workflow_dispatch:

jobs:
  test-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run backtest regression tests
        working-directory: tools
        run: python test_backtest_model.py
      - name: Run market regime tests
        working-directory: tools
        run: python test_market_regime.py
      - name: Run news feature tests
        working-directory: tools
        run: python test_news_features.py
      - name: Run training data validation tests
        working-directory: tools
        run: python test_training_data.py
