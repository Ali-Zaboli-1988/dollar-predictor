name: Android Emulator Smoke

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-smoke.yml'
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Commit, branch, or tag to validate'
        required: false
        default: ''

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.sha }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Boot emulator and install APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            set -e
            echo '--- APK ---'
            ls -lh app/build/outputs/apk/debug/app-debug.apk
            echo '--- INSTALL ---'
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            echo 'INSTALL_EXIT=0'
            echo '--- PACKAGE PATH ---'
            adb shell pm path com.alizaboli.dollarpredictor
            echo '--- START ACTIVITY ---'
            adb shell am start -n com.alizaboli.dollarpredictor/.MainActivity
            echo '--- WAIT FOR ACTIVITY ---'
            adb shell sleep 3
            echo '--- ACTIVITY WITH RETRY/BACKOFF ---'
            for DELAY in 0 2 4 8; do [ "${DELAY}" -eq 0 ] || adb shell sleep "${DELAY}"; adb shell dumpsys activity activities | tee /tmp/activity-output.txt | grep -Fq 'com.alizaboli.dollarpredictor/.MainActivity' && exit 0; echo "Activity not observed; retrying after backoff ${DELAY}s"; done; cat /tmp/activity-output.txt; exit 1
            echo '--- PROCESS (DIAGNOSTIC ONLY) ---'
            PID="$(adb shell pidof com.alizaboli.dollarpredictor || true)"; echo "PID=${PID}"; [ -n "${PID}" ] || echo 'PID_NOT_OBSERVED'

      - name: Collect emulator diagnostics on failure
        if: failure()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb shell pm list packages | grep -F com.alizaboli.dollarpredictor || true
            adb shell dumpsys activity activities | grep -i dollarpredictor || true
            adb shell ps | grep -i dollarpredictor || true
            adb logcat -d -t 300 | grep -E 'AndroidRuntime|FATAL EXCEPTION|dollarpredictor' | tail -n 120 || true
