name: Android Emulator Smoke

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Boot emulator and install APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            set -e
            echo '--- APK ---'
            ls -lh app/build/outputs/apk/debug/app-debug.apk
            echo '--- INSTALL ---'
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            echo 'INSTALL_EXIT=0'
            echo '--- PACKAGE PATH ---'
            adb shell pm path com.alizaboli.dollarpredictor
            echo '--- START ACTIVITY ---'
            adb shell am start -n com.alizaboli.dollarpredictor/.MainActivity
            sleep 3
            echo '--- PROCESS ---'
            adb shell pidof com.alizaboli.dollarpredictor
            echo '--- ACTIVITY ---'
            adb shell dumpsys activity activities | grep -F 'com.alizaboli.dollarpredictor/.MainActivity' | head -n 5

      - name: Collect emulator diagnostics on failure
        if: failure()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb shell pm list packages | grep -F com.alizaboli.dollarpredictor || true
            adb logcat -d -t 300 | grep -E 'AndroidRuntime|FATAL EXCEPTION|dollarpredictor' | tail -n 120 || true
